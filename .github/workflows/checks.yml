name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check src tests benchmarks launch.py
      - run: python -m ruff format --check src tests benchmarks launch.py
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          node-version: '22'
      - name: Check real keyboard editing in Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dayweave-browser" --no-package-lock playwright@1.62.1
          dayweave_browser="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -n "$dayweave_browser" ]; then
            echo "Using preinstalled Chrome: $dayweave_browser"
          else
            echo "Preinstalled Chrome not found; installing Playwright Chromium."
            "$RUNNER_TEMP/dayweave-browser/node_modules/.bin/playwright" install --with-deps chromium
            dayweave_browser="$(NODE_PATH="$RUNNER_TEMP/dayweave-browser/node_modules" node -p "require('playwright').chromium.executablePath()")"
            echo "Using Playwright Chromium: $dayweave_browser"
          fi
          export BROWSER_PATH="$dayweave_browser"
          "$BROWSER_PATH" --version
          dayweave serve --port 8787 > "$RUNNER_TEMP/dayweave-browser/server.log" 2>&1 &
          dayweave_server_pid=$!
          trap 'kill "$dayweave_server_pid" 2>/dev/null || true' EXIT
          python - <<'PYWAIT'
          import time
          import urllib.error
          import urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8787", timeout=1).close()
                  break
              except (OSError, urllib.error.URLError):
                  time.sleep(0.2)
          else:
              raise SystemExit("DayWeave server did not become ready")
          PYWAIT
          NODE_PATH="$RUNNER_TEMP/dayweave-browser/node_modules" node tests/browser_editing.cjs
